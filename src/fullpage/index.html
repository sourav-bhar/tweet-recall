<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tweet Recall - Full View</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div class="app">
      <!-- Sidebar -->
      <aside class="sidebar">
        <div class="sidebar__header">
          <h1 class="sidebar__title">Tweet Recall</h1>
        </div>

        <!-- Quick Filters -->
        <section class="sidebar__section">
          <h2 class="sidebar__section-title">Time Filter</h2>
          <div class="sidebar__options">
            <button class="sidebar__option active" data-filter="all">All Time</button>
            <button class="sidebar__option" data-filter="today">Today</button>
            <button class="sidebar__option" data-filter="week">Last 7 Days</button>
            <button class="sidebar__option" data-filter="month">Last 30 Days</button>
          </div>
        </section>

        <!-- Type Filters -->
        <section class="sidebar__section">
          <h2 class="sidebar__section-title">Tweet Type</h2>
          <div class="sidebar__checkboxes">
            <label class="sidebar__checkbox">
              <input type="checkbox" id="filter-media" />
              <span>Has Media</span>
            </label>
            <label class="sidebar__checkbox">
              <input type="checkbox" id="filter-retweet" />
              <span>Retweets</span>
            </label>
            <label class="sidebar__checkbox">
              <input type="checkbox" id="filter-thread" />
              <span>Threads</span>
            </label>
            <label class="sidebar__checkbox">
              <input type="checkbox" id="filter-quote" />
              <span>Quote Tweets</span>
            </label>
          </div>
        </section>

        <!-- Collections -->
        <section class="sidebar__section">
          <div class="sidebar__section-header">
            <h2 class="sidebar__section-title">Collections</h2>
            <button id="new-collection-btn" class="sidebar__add-btn" title="New Collection">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M12 5v14 M5 12h14" />
              </svg>
            </button>
          </div>
          <div id="collections-list" class="sidebar__collections">
            <button class="sidebar__collection active" data-collection="all">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z" />
              </svg>
              <span>All Tweets</span>
            </button>
            <button class="sidebar__collection" data-collection="__favorites__">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z" />
              </svg>
              <span>Favorites</span>
            </button>
            <!-- Dynamic collections will be inserted here -->
          </div>
        </section>

        <!-- Stats -->
        <section class="sidebar__section sidebar__stats">
          <div id="stats-display">
            <div class="stat-item">
              <span class="stat-value" id="stat-total">0</span>
              <span class="stat-label">Total Tweets</span>
            </div>
            <div class="stat-item">
              <span class="stat-value" id="stat-authors">0</span>
              <span class="stat-label">Authors</span>
            </div>
          </div>
        </section>

        <!-- Settings -->
        <section class="sidebar__footer">
          <button id="export-btn" class="sidebar__footer-btn">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
              <polyline points="7 10 12 15 17 10" />
              <line x1="12" y1="15" x2="12" y2="3" />
            </svg>
            Export Data
          </button>
          <button id="clear-btn" class="sidebar__footer-btn danger">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <polyline points="3 6 5 6 21 6" />
              <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2" />
            </svg>
            Clear All Data
          </button>
        </section>
      </aside>

      <!-- Main Content -->
      <main class="main-content">
        <!-- Header with Search -->
        <header class="main-header">
          <div class="search-container">
            <svg class="search-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="11" cy="11" r="8" />
              <path d="m21 21-4.35-4.35" />
            </svg>
            <input
              type="text"
              id="search-input"
              class="search-input"
              placeholder="Search tweets... (try from:username, has:media, after:2024-01-01)"
              autocomplete="off"
            />
            <kbd class="search-shortcut">/</kbd>
          </div>

          <!-- View Controls -->
          <div class="view-controls">
            <div class="sort-dropdown">
              <button id="sort-btn" class="sort-btn">
                <span id="sort-label">Newest First</span>
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M6 9l6 6 6-6" />
                </svg>
              </button>
              <div id="sort-menu" class="sort-menu hidden">
                <button class="sort-option active" data-sort="newest">Newest First</button>
                <button class="sort-option" data-sort="oldest">Oldest First</button>
                <button class="sort-option" data-sort="author">By Author</button>
              </div>
            </div>

            <div class="view-toggle">
              <button id="view-list" class="view-btn active" title="List View">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <line x1="8" y1="6" x2="21" y2="6" />
                  <line x1="8" y1="12" x2="21" y2="12" />
                  <line x1="8" y1="18" x2="21" y2="18" />
                  <line x1="3" y1="6" x2="3.01" y2="6" />
                  <line x1="3" y1="12" x2="3.01" y2="12" />
                  <line x1="3" y1="18" x2="3.01" y2="18" />
                </svg>
              </button>
              <button id="view-grid" class="view-btn" title="Grid View">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <rect x="3" y="3" width="7" height="7" />
                  <rect x="14" y="3" width="7" height="7" />
                  <rect x="14" y="14" width="7" height="7" />
                  <rect x="3" y="14" width="7" height="7" />
                </svg>
              </button>
            </div>

            <button id="toggle-media" class="toggle-media-btn" title="Show images">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <rect x="3" y="3" width="18" height="18" rx="2" ry="2" />
                <circle cx="8.5" cy="8.5" r="1.5" />
                <polyline points="21 15 16 10 5 21" />
              </svg>
              <span>Images</span>
            </button>
          </div>
        </header>

        <!-- Active Filters -->
        <div id="active-filters" class="active-filters hidden"></div>

        <!-- Results Count -->
        <div class="results-header">
          <span id="results-count">Loading...</span>
        </div>

        <!-- Tweet Results -->
        <div id="results" class="results" role="listbox" aria-label="Tweet results">
          <div class="loading-state">
            <div class="spinner"></div>
            <p>Loading tweets...</p>
          </div>
        </div>

        <!-- Pagination -->
        <div id="pagination" class="pagination hidden">
          <button id="load-more-btn" class="load-more-btn">
            Load More
          </button>
        </div>
      </main>

      <!-- Detail Panel (optional, for expanded tweet view) -->
      <aside id="detail-panel" class="detail-panel hidden">
        <div class="detail-panel__header">
          <h2>Tweet Details</h2>
          <button id="close-detail" class="detail-panel__close">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M18 6L6 18 M6 6l12 12" />
            </svg>
          </button>
        </div>
        <div id="detail-content" class="detail-panel__content"></div>
      </aside>
    </div>

    <!-- Create Collection Modal -->
    <div id="collection-modal" class="modal hidden">
      <div class="modal__backdrop"></div>
      <div class="modal__content">
        <h2 class="modal__title">Create Collection</h2>
        <form id="collection-form">
          <div class="form-group">
            <label for="collection-name">Name</label>
            <input type="text" id="collection-name" required placeholder="My Collection" />
          </div>
          <div class="form-group">
            <label for="collection-description">Description (optional)</label>
            <input type="text" id="collection-description" placeholder="A brief description..." />
          </div>
          <div class="form-group">
            <label>Color</label>
            <div class="color-picker">
              <button type="button" class="color-option" data-color="#f4212e" style="background: #f4212e"></button>
              <button type="button" class="color-option" data-color="#ff7a00" style="background: #ff7a00"></button>
              <button type="button" class="color-option" data-color="#ffd700" style="background: #ffd700"></button>
              <button type="button" class="color-option" data-color="#00ba7c" style="background: #00ba7c"></button>
              <button type="button" class="color-option selected" data-color="#1d9bf0" style="background: #1d9bf0"></button>
              <button type="button" class="color-option" data-color="#7856ff" style="background: #7856ff"></button>
              <button type="button" class="color-option" data-color="#f91880" style="background: #f91880"></button>
              <button type="button" class="color-option" data-color="#71767b" style="background: #71767b"></button>
            </div>
          </div>
          <div class="modal__actions">
            <button type="button" id="cancel-collection" class="btn-secondary">Cancel</button>
            <button type="submit" class="btn-primary">Create</button>
          </div>
        </form>
      </div>
    </div>

    <!-- Add to Collection Modal -->
    <div id="add-to-collection-modal" class="modal hidden">
      <div class="modal__backdrop"></div>
      <div class="modal__content">
        <h2 class="modal__title">Add to Collection</h2>
        <div id="add-to-collection-list" class="collection-select-list">
          <!-- Collections will be populated here -->
        </div>
        <div class="modal__actions">
          <button type="button" id="cancel-add-to-collection" class="btn-secondary">Cancel</button>
        </div>
      </div>
    </div>

    <!-- Screen reader announcements -->
    <div id="announcements" aria-live="polite" aria-atomic="true" class="sr-only"></div>

    <script type="module" src="./main.ts"></script>
  </body>
</html>
